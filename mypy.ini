[mypy]
python_version = 3.12
ignore_missing_imports = True
# amp_mypy invokes mypy one file at a time, so per-module sections below look
# "unused" from any single file's point of view; silence that.
warn_unused_configs = False
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
plugins = pydantic.mypy
# Lenient by default: run one file at a time, a test resolves to its bare stem
# (``test_foo``), so strictness is opted into for ``operant.*`` only.
disallow_untyped_defs = False
disallow_incomplete_defs = False
# Tests deliberately access attributes on union results after asserting the
# variant; disabled by default and re-enabled for the shipped package.
disable_error_code = union-attr, var-annotated, arg-type

# The shipped package is held to the full standard.
[mypy-operant.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
enable_error_code = union-attr, var-annotated, arg-type

# Vendored amp linter and helpers: third-party, type checked upstream.
[mypy-operant.dev.helpers.*]
ignore_errors = True

[mypy-operant.dev.linters.*]
ignore_errors = True

# xa11y's stubs are incomplete; scope the false positives to the macOS layer.
[mypy-operant.adapters.macos.*]
disable_error_code = unreachable, no-any-return, attr-defined
