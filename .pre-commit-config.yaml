repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: style
        name: style checks
        entry: uv run python scripts/check_style.py src
        language: system
        pass_filenames: false
      - id: web-lint
        name: web lint
        entry: bash -c 'cd web && [ -d node_modules ] && pnpm lint || true'
        language: system
        files: ^web/
        pass_filenames: false
