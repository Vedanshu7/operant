[project]
name = "operant"
version = "0.1.0"
description = "Computer-use automation: an LLM discovers a task once, the system compiles it into a versioned capability, and replays it deterministically under human-approved guardrails."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.0",
    "fastapi>=0.141.1",
    "filelock>=3.18.0",
    "httpx>=0.28.0",
    "litellm>=1.97.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.41",
    "sse-starlette>=2.3.0",
    "tldextract>=5.4.0",
    "typer>=0.16.0",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
macos = [
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "xa11y>=0.13.0",
]
capture = [
    "openadapt-capture>=1.2.2",
]
privacy = [
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "spacy>=3.8.16",
]
observability = [
    "langfuse>=5.0.4",
]
optimize = [
    "gepa>=0.1.4",
]

[project.scripts]
operant = "operant.cli.main:main"
# The task runner is called `i` (e.g. `i lint`); this shim makes it exist.
i = "invoke.main:program.run"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.1.0",
    # Vendored amp linter (src/operant/dev/linters): the driver shells out to
    # one binary per action and imports joblib/libcst/more-itertools directly.
    "autoflake",
    "black",
    "docformatter",
    "flake8",
    "invoke",
    "isort",
    "joblib",
    "libcst",
    "more-itertools",
    "pydocstyle",
    "pylint",
    "pyment",
    "pillow>=12.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operant"]

# Coding standard is the vendored amp linter (src/operant/dev/linters), run
# via `i lint`; it shells out to black/isort/flake8/pylint/mypy/docformatter.
# mypy reads mypy.ini. Line length matches the linter: black at 82, isort at 82.
[tool.black]
line-length = 82
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 82

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
# A hung wait fails its test instead of the whole run.
timeout = 60
markers = [
    "macos: needs the macOS accessibility stack",
    "live: drives a real application; excluded from CI",
    "privacy: needs the privacy extra and a spaCy model",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["operant"]
# The vendored linter is third-party code, tested upstream.
omit = ["src/operant/dev/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
